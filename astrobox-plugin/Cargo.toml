[package]
name = "nctalk-credential"
version = "0.1.14"
edition = "2024"
description = "Push Nextcloud Talk credentials to the Vela watch app from AstroBox"

[lib]
name = "nctalk_credential"
crate-type = ["cdylib"]

[dependencies]
astrobox-ng-wit = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
