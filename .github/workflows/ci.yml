name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded pushes should not keep burning runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Set the repository variable HTTP_PROXY (Settings -> Secrets and variables ->
# Actions -> Variables) if the runner needs a proxy for npm / crates.io.
# Undefined expands to an empty string, and the steps below only export it when
# non-empty, so nothing leaks an empty http_proxy into the tooling.
env:
  HTTP_PROXY: ${{ vars.HTTP_PROXY }}
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- JS layer
  test:
    name: test (js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          node -v
          npm -v

      # Pure Node tests, no toolkit install, emulator or device needed.
      - name: Test
        run: npm test

  # ------------------------------------------------------------- Rust plugin
  test-plugin:
    name: test (plugin protocol)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astrobox-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Rust
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
            # rustup only appends to a shell profile and $GITHUB_PATH only
            # affects *later* steps, so export here too: without this the
            # `cargo` call below exits 127 inside this very step.
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          # Follow the channel pinned in rust-toolchain.toml: the wasi version
          # baked into the component depends on it (see that file).
          CHANNEL=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$CHANNEL" --profile minimal
          cargo --version

      # The plugin crate only builds for wasm32-wasip2 because it links
      # wit-bindgen, but src/protocol.rs is pure serde: tests/protocol.rs
      # includes it by path and compiles for the host. No wasm target needed.
      - name: Test protocol
        run: |
          if [ -n "${HTTP_PROXY:-}" ]; then
            export http_proxy="$HTTP_PROXY" https_proxy="$HTTP_PROXY"
          fi
          cargo test --target x86_64-unknown-linux-gnu --test protocol

  # ---------------------------------------------------------------------- rpk
  build-rpk:
    name: build (rpk-${{ matrix.shape }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shape: circle
            suffix: xiaomi-watch-s3-s4-s4-sport
          - shape: rect
            suffix: redmi-watch-5
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          if [ -n "${HTTP_PROXY:-}" ]; then
            export http_proxy="$HTTP_PROXY" https_proxy="$HTTP_PROXY"
          fi
          npm ci --no-audit --no-fund

      # Release builds require explicit signing material; fork PRs and repos
      # without signing secrets produce debug packages instead.
      - name: Configure signing
        id: signing
        env:
          PRIVATE_PEM: ${{ secrets.SIGN_PRIVATE_PEM }}
          CERT_PEM: ${{ secrets.SIGN_CERT_PEM }}
        run: |
          if [ -n "$PRIVATE_PEM" ] && [ -n "$CERT_PEM" ]; then
            umask 077
            mkdir -p sign/release
            printf '%s\n' "$PRIVATE_PEM" > sign/release/private.pem
            printf '%s\n' "$CERT_PEM" > sign/release/certificate.pem
            openssl x509 -in sign/release/certificate.pem -noout -subject -enddate
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif [ -n "$PRIVATE_PEM" ] || [ -n "$CERT_PEM" ]; then
            echo 'Both SIGN_PRIVATE_PEM and SIGN_CERT_PEM must be configured' >&2
            exit 1
          else
            echo 'No signing secrets; building a toolkit-signed debug package'
            echo "mode=build" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and verify package
        env:
          MODE: ${{ steps.signing.outputs.mode }}
          SHAPE: ${{ matrix.shape }}
        run: |
          npm run "$MODE:$SHAPE"
          shopt -s nullglob
          packages=(dist/*-"$SHAPE".rpk)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected one $SHAPE RPK, got ${#packages[@]}" >&2
            exit 1
          fi
          unzip -tq "${packages[0]}"

      - uses: actions/upload-artifact@v4
        with:
          name: rpk-${{ matrix.suffix }}
          path: dist/*-${{ matrix.shape }}.rpk
          if-no-files-found: error

  # ---------------------------------------------------------------------- abp
  build-plugin:
    name: build (abp)
    needs: test-plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astrobox-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Rust
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          # Follow the channel pinned in rust-toolchain.toml: the wasi version
          # baked into the component depends on it. Getting this wrong yields a
          # component that compiles fine and then refuses to load.
          CHANNEL=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$CHANNEL" --profile minimal --target wasm32-wasip2
          cargo --version
          rustc --print target-libdir --target wasm32-wasip2

      # build_dist.py shells out to `cargo` via PATH. Put the rustup toolchain
      # first: some images also ship a distro rustc without wasm std, which
      # fails with "can't find crate for core".
      - name: Package
        run: |
          if [ -n "${HTTP_PROXY:-}" ]; then
            export http_proxy="$HTTP_PROXY" https_proxy="$HTTP_PROXY"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          python3 --version
          python3 scripts/build_dist.py --release --package
          ls -l dist/

      # Fail here rather than on the phone: this rejects a package whose
      # manifest, entry or permissions would not install.
      - name: Check artifact
        run: python3 scripts/check_artifact.py

      - uses: actions/upload-artifact@v4
        with:
          name: abp
          path: astrobox-plugin/dist/*.abp
          if-no-files-found: error
